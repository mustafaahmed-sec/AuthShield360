[project]
name = "authshield360"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.17",
  "Authlib==1.8.0",
  "google-auth[requests]==2.58.0",
  "requests==2.34.2",
  "psycopg[binary]==3.3.6",
  "python-dotenv==1.2.3",
  "gunicorn==26.2.0",
  "whitenoise==6.12.0",
]

[tool.vercel.scripts]
build = "python manage.py migrate --noinput"
