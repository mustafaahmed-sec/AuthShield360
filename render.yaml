services:
  - type: web
    name: authshield360-preview
    runtime: python
    region: virginia
    plan: 0.5c-512mb
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 4 --timeout 60
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      - key: AUTHSHIELD_PROTECTED_DEMO
        value: "false"
